<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('moiz-prefs');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme =
            prefs.theme === 'light' || prefs.theme === 'dark'
              ? prefs.theme
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var lang =
            prefs.lang === 'ar' || prefs.lang === 'en'
              ? prefs.lang
              : String(navigator.language || '')
                    .toLowerCase()
                    .indexOf('ar') === 0
                ? 'ar'
                : 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- seo:start (regenerated per route at build time, see src/seo/meta.js) -->
    <!-- seo:end -->
    <meta
      name="keywords"
      content="Moiez, MoiezDev, Senior Full Stack Engineer, Portfolio, React, Vue, Next.js, Node.js, NestJS, UI/UX Design"
    />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
