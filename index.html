<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('moiz-prefs');
          var prefs = raw ? JSON.parse(raw) : {};
          var theme =
            prefs.theme === 'light' || prefs.theme === 'dark'
              ? prefs.theme
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          var lang =
            prefs.lang === 'ar' || prefs.lang === 'en'
              ? prefs.lang
              : String(navigator.language || '')
                    .toLowerCase()
                    .indexOf('ar') === 0
                ? 'ar'
                : 'en';
          document.documentElement.lang = lang;
          document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
          document.documentElement.setAttribute('data-theme', theme);
          // pages are prerendered in English: keep them hidden until the app renders
          // Arabic (or the page an old #/ link points to)
          if (lang === 'ar' || location.hash.indexOf('#/') === 0) {
            document.documentElement.classList.add('prerender-hide');
          }
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <!-- seo:start (regenerated per route at build time, see src/seo/meta.js) -->
    <!-- seo:end -->
    <!-- pages are served (and prerendered) in English; Arabic is an in-page toggle on
         the same URLs, so there are no hreflang alternates or og:locale:alternate -->
    <meta property="og:locale" content="en_US" />
    <meta name="author" content="Moieez ur Rehman" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
